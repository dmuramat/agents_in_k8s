apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agent-tls-gateway
  namespace: kube-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: tls-passthrough
      protocol: TLS
      port: 443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
