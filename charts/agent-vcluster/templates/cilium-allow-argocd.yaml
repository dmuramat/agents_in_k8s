apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vcluster-allow-argocd
  namespace: {{ .Values.name }}
spec:
  endpointSelector:
    matchLabels:
      release: vcluster
  ingress:
    # Allow ArgoCD to reach vCluster API for multi-cluster management
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "443"
              protocol: TCP
